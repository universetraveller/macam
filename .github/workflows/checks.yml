name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inspect selected command-line toolchain
        run: |
          xcode-select -p
          xcrun --show-sdk-version
          xcrun swiftc --version
          node --version
      - name: Compile, sign, and run deterministic checks
        run: ./scripts/test.sh
      - name: Check whitespace
        run: git diff --check
      # Hosted CI does not grant TCC or validate live system/browser audio.
