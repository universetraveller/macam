name: Prepare release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build, test, and prepare matching app/source assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          ./scripts/prepare-release.sh --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-release
          path: .build/releases/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-release
          path: release
      - name: Create an unpublished draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          # No --clobber or publish: an existing release causes a safe failure.
          gh release create "$RELEASE_TAG" ./* \
            --verify-tag --draft --title "Macam $RELEASE_TAG" \
            --notes-file release-notes.md
